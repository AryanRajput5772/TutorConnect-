<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tcGrad)" filter="url(#shadow)" />

  <!-- Graduation Cap Rhombus (Crown) -->
  <polygon points="32,16 53,26 32,36 11,26" fill="#ffffff" />
  <polygon points="32,19 49,26 32,33 15,26" fill="#f8fafc" />

  <!-- Skullcap underside -->
  <path d="M21,32 L21,41 C21,46.5 43,46.5 43,41 L43,32 C39.5,35 24.5,35 21,32 Z" fill="#e2e8f0" />
  <path d="M23,34 C26.5,36.5 37.5,36.5 41,34 C41,39 23,39 23,34 Z" fill="#cbd5e1" opacity="0.6" />

  <!-- Button on cap top -->
  <ellipse cx="32" cy="26" rx="2.5" ry="1.5" fill="url(#tasselGrad)" />

  <!-- Tassel ribbon & fringe -->
  <path d="M32,26 Q43,28 47,35 L47,43" fill="none" stroke="url(#tasselGrad)" stroke-width="2.2" stroke-linecap="round" />
  <polygon points="45,42 49,42 48,48 46,48" fill="url(#tasselGrad)" />
</svg>

